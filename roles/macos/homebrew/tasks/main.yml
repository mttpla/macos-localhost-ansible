---
- name: Check that Homebrew is installed
  ansible.builtin.command: brew --version
  register: brew_version
  changed_when: false
  failed_when: brew_version.rc != 0

- name: Check that the Brewfile exists
  ansible.builtin.stat:
    path: '{{ brewfile_path }}'
  register: brewfile

- name: Fail when the Brewfile is missing
  ansible.builtin.fail:
    msg: 'Brewfile not found at {{ brewfile_path }}'
  when: not brewfile.stat.exists

- name: Upgrade all Homebrew packages
  ansible.builtin.command: brew upgrade
  register: brew_upgrade
  changed_when: brew_upgrade.stdout | length > 0
  when: homebrew_upgrade_all

# Mac App Store entries need a signed-in Apple ID. `mas install` can only
# install apps already associated with the account, so a brand new Mac must
# be signed in to the same Apple ID before this runs.
- name: Install everything listed in the Brewfile
  ansible.builtin.command: brew bundle install --file={{ brewfile_path }} --no-upgrade
  register: brew_bundle
  changed_when: "'Installing' in brew_bundle.stdout"
