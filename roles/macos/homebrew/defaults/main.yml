---

# Everything Homebrew installs lives in the Brewfile at the repo root.
# Regenerate it from the current machine with:
#   brew bundle dump --force
# and see what is installed but not listed with:
#   brew bundle cleanup
brewfile_path: '{{ playbook_dir }}/Brewfile'

# Run `brew upgrade` before applying the Brewfile. Off by default: a bootstrap
# should not double as a package updater.
homebrew_upgrade_all: false
